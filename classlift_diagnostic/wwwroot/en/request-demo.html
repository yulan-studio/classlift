<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassLift — Request a Demo</title><link rel="stylesheet" href="/styles.css?v=20260824-2"></head><body><header class="site-header"><a class="brand" href="/en/"><img class="brand-logo" src="/images/classlift_logo.png" alt=""><span>ClassLift</span></a><div class="header-note"><span class="status-dot"></span> Request a Demo · <a class="language-link" href="/request-demo">中文</a></div></header><main class="lead-gate"><div class="generating-card"><span class="eyebrow simple">REQUEST A DEMO</span><h2>See how ClassLift can help your business</h2><p>Tell us a little about your operation and we'll arrange a focused product demo.</p><form id="demoForm"><label>Your name<input name="name" required autocomplete="name" placeholder="Alex Chen"></label><label>Work email<input type="email" name="email" required autocomplete="email" placeholder="alex@company.com"></label><label>Organization<input name="organization" required autocomplete="organization"></label><label>Phone <small>Optional</small><input name="phone" autocomplete="tel"></label><label>Organization size <small>Optional</small><input name="companySize" placeholder="e.g. 100–300 students"></label><label>What would you like to see?<textarea name="mainGoal" required class="textarea" placeholder="e.g. scheduling, billing, parent communication"></textarea></label><label>Preferred demo time <small>Optional</small><input name="preferredTime" placeholder="e.g. Tuesday morning"></label><button class="primary-btn" type="submit">Request a demo <span>→</span></button><div id="message" class="error"></div></form><div class="privacy-note">🔒 We'll only use your information to arrange your demo.</div></div></main><script src="/request-demo.js"></script></body></html>
