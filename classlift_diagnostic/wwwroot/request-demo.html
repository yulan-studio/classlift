<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassLift — 预约演示</title><link rel="stylesheet" href="/styles.css?v=20260824-2"></head><body><header class="site-header"><a class="brand" href="https://classlift.ca"><img class="brand-logo" src="/images/classlift_logo.png" alt=""><span>ClassLift</span></a><div class="header-note"><a class="language-link" href="/cn/">免费诊断</a><a class="language-link" href="/en/request-demo.html">EN</a></div></header><main class="lead-gate"><div class="generating-card"><span class="eyebrow simple">REQUEST A DEMO</span><h2>看看 ClassLift 如何帮助你的业务</h2><p>留下基本信息，我们会根据你的业务情况安排一次针对性的产品演示。</p><form id="demoForm"><label>你的名字<input name="name" required autocomplete="name" placeholder="例如：Alex Chen"></label><label>工作 Email<input type="email" name="email" required autocomplete="email" placeholder="alex@company.com"></label><label>机构名称<input name="organization" required autocomplete="organization" placeholder="你的机构名称"></label><label>联系电话 <small>选填</small><input name="phone" autocomplete="tel"></label><label>机构规模 <small>选填</small><input name="companySize" placeholder="例如：100–300 名学生"></label><label>你最想了解什么？<textarea name="mainGoal" required class="textarea" placeholder="例如：排课、收费、家长沟通和运营数据"></textarea></label><label>希望的 Demo 时间 <small>选填</small><input name="preferredTime" placeholder="例如：下周二上午"></label><button class="primary-btn" type="submit">提交 Demo 申请 <span>→</span></button><div id="message" class="error"></div></form></div></main><script src="/request-demo-cn.js"></script></body></html>
