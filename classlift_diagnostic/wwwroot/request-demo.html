<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassLift — Request a Demo</title><link rel="stylesheet" href="/styles.css?v=20260824-2"></head><body><header class="site-header"><a class="brand" href="/cn/"><img class="brand-logo" src="/images/classlift_logo.png" alt=""><span>ClassLift</span></a><div class="header-note"><span class="status-dot"></span> Request a Demo · <a class="language-link" href="/en/request-demo.html">EN</a></div></header><main class="lead-gate"><div class="generating-card"><span class="eyebrow simple">REQUEST A DEMO</span><h2>看看 ClassLift 如何帮助你的业务</h2><p>留下基本信息，我们会根据你的业务情况安排一次针对性的产品演示。</p><form id="demoForm"><label>你的名字<input name="name" required autocomplete="name" placeholder="例如：Alex Chen"></label><label>工作 Email<input type="email" name="email" required autocomplete="email" placeholder="alex@company.com"></label><label>机构名称<input name="organization" required autocomplete="organization" placeholder="你的机构名称"></label><label>联系电话 <small>选填</small><input name="phone" autocomplete="tel"></label><label>机构规模 <small>选填</small><input name="companySize" placeholder="例如：100–300 名学生"></label><label>你最想了解什么？<textarea name="mainGoal" required class="textarea" placeholder="例如：排课、收费、家长沟通和运营数据"></textarea></label><label>希望的 Demo 时间 <small>选填</small><input name="preferredTime" placeholder="例如：下周二上午"></label><button class="primary-btn" type="submit">提交 Demo 申请 <span>→</span></button><div id="message" class="error"></div></form><div class="privacy-note">🔒 我们只会使用你的资料来联系你安排 Demo。</div></div></main><script>const form=document.querySelector('#demoForm'),message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();message.textContent='';const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/demo-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!r.ok){const d=await r.json();message.textContent=Object.values(d.errors||{}).flat().join(' ' )||'提交失败，请稍后再试。';return}form.innerHTML='<div class="check-ring">✓</div><h2>申请已收到</h2><p>谢谢！我们会尽快联系你安排 Demo。</p>'}catch{message.textContent='暂时无法提交，请稍后再试。'}finally{button.disabled=false}};</script></body></html>
