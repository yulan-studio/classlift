<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sales Leads · ClassLift</title>
  <style>
    :root{--ink:#143c35;--deep:#0c2d28;--paper:#f5f2e9;--white:#fff;--lime:#d9f04a;--orange:#ff8a62;--muted:#6d7b77;--line:#dce1dc}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}.top{height:72px;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--lime);color:var(--deep);font-family:Georgia,serif;font-style:italic}.top button{border:1px solid #47645e;background:transparent;color:#fff;padding:9px 13px;cursor:pointer}
    main{max-width:1280px;margin:auto;padding:46px 4vw 80px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1{font-family:Georgia,"Microsoft YaHei",serif;font-size:44px;font-weight:500;margin:9px 0 0}.count{font-family:Georgia,serif;font-size:28px}.count small{font-family:Arial;font-size:11px;color:var(--muted)}
    .filters{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin:30px 0 18px}.filters input,.filters select{border:1px solid var(--line);background:#fff;padding:12px;color:var(--ink)}.filters button,.export{border:0;background:var(--ink);color:#fff;padding:0 18px;cursor:pointer;text-decoration:none;display:grid;place-items:center;font-size:13px}.table-wrap{background:#fff;border:1px solid var(--line);overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th{text-align:left;padding:13px 15px;font-size:10px;letter-spacing:.08em;color:var(--muted);background:#f0eee7;border-bottom:1px solid var(--line)}td{padding:15px;font-size:13px;border-bottom:1px solid #edf0ed}tbody tr{cursor:pointer}tbody tr:hover{background:#fafbf6}.person b,.person span{display:block}.person span{color:var(--muted);font-size:11px;margin-top:4px}.score{font-family:Georgia,serif;font-size:21px}.pill{display:inline-block;padding:5px 8px;font-size:10px;font-weight:700;border-radius:2px;background:#e7ece8}.pill.very-high{background:#ffd8cb;color:#8c321e}.pill.high{background:#fff0b7;color:#705b00}.pill.medium{background:#e4edca}.empty{text-align:center!important;padding:50px!important;color:var(--muted)}.pagination{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px;font-size:12px}.pagination button{border:1px solid var(--line);background:#fff;padding:8px 12px;cursor:pointer}.pagination button:disabled{opacity:.4}
    dialog{width:min(760px,calc(100% - 30px));max-height:90vh;border:0;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.3);color:var(--ink)}dialog::backdrop{background:rgba(7,29,25,.7)}.detail-head{background:var(--deep);color:#fff;padding:28px 32px;display:flex;justify-content:space-between}.detail-head h2{font-family:Georgia,"Microsoft YaHei",serif;font-size:30px;font-weight:500;margin:5px 0}.close{border:0;background:none;color:#fff;font-size:25px;cursor:pointer}.detail-body{padding:30px 32px}.meta-grid,.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meta,.metric{background:#f4f2eb;padding:13px}.meta span,.metric span{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.metric strong{font-family:Georgia,serif;font-size:23px}.section{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.section h3{font-size:13px;margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#edf0eb;padding:7px 9px;font-size:12px}.priority{border-left:4px solid var(--lime);background:#f4f2eb;padding:14px;line-height:1.55}.notes{white-space:pre-wrap;line-height:1.6;color:#4d625c}.loading{padding:50px;text-align:center;color:var(--muted)}
    @media(max-width:700px){.heading{align-items:start;flex-direction:column}.filters{grid-template-columns:1fr}.filters button,.export{padding:13px}.meta-grid,.score-grid{grid-template-columns:1fr 1fr}.detail-body{padding:24px 20px}h1{font-size:36px}}
  </style>
</head>
<body><header class="top"><div class="brand"><span class="mark">C</span>ClassLift <small>SALES</small></div><button id="logout">退出登录</button></header><main><div class="heading"><div><div class="eyebrow">BUSINESS SCALABILITY LEADS</div><h1>诊断客户</h1></div><div class="count"><span id="total">—</span> <small>LEADS</small></div></div><div class="filters"><input id="search" placeholder="搜索姓名、Email、机构或问题"><select id="intent"><option value="">全部意向等级</option><option>VERY HIGH</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>RESEARCH</option></select><a id="export" class="export" href="/api/admin/leads.csv">导出 CSV</a></div><div class="table-wrap"><table><thead><tr><th>客户</th><th>机构</th><th>最紧急问题</th><th>希望时间</th><th>评分</th><th>意向</th><th>提交时间</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="loading">正在读取 Lead…</td></tr></tbody></table></div><div class="pagination"><button id="prev">← 上一页</button><span id="pageInfo"></span><button id="next">下一页 →</button></div></main>
<dialog id="detail"><div class="detail-head"><div><small>LEAD DETAIL</small><h2 id="detailName"></h2></div><button class="close" aria-label="关闭">×</button></div><div id="detailBody" class="detail-body"></div></dialog>
<script>
const state={page:1,pageSize:25,total:0};const $=s=>document.querySelector(s);const text=(tag,value,className)=>{const node=document.createElement(tag);node.textContent=value??'—';if(className)node.className=className;return node};
function intentClass(value){return value.toLowerCase().replace(' ','-')}
async function load(){const params=new URLSearchParams({page:state.page,pageSize:state.pageSize});if($('#search').value.trim())params.set('search',$('#search').value.trim());if($('#intent').value)params.set('intent',$('#intent').value);$('#export').href='/api/admin/leads.csv?'+params;const response=await fetch('/api/admin/leads?'+params);if(response.status===401){location.href='/admin/login';return}const data=await response.json();state.total=data.total;$('#total').textContent=data.total;const tbody=$('#rows');tbody.replaceChildren();if(!data.items.length){const td=text('td','没有符合条件的 Lead','empty');td.colSpan=7;const tr=document.createElement('tr');tr.append(td);tbody.append(tr)}for(const lead of data.items){const tr=document.createElement('tr');tr.addEventListener('click',()=>showDetail(lead.id));const person=document.createElement('td');person.className='person';person.append(text('b',lead.name),text('span',lead.email));const org=document.createElement('td');org.append(text('b',`${lead.organization||'—'} -- ${lead.businessType}`));const pill=text('span',lead.leadIntent,'pill '+intentClass(lead.leadIntent));[person,org,text('td',lead.primaryPain),text('td',lead.implementationTimeline),text('td',lead.totalScore+'/100','score'),(()=>{const td=document.createElement('td');td.append(pill);return td})(),text('td',new Date(lead.createdAt).toLocaleString('zh-CN'))].forEach(x=>tr.append(x));tbody.append(tr)}const pages=Math.max(1,Math.ceil(data.total/state.pageSize));$('#pageInfo').textContent=`第 ${state.page} / ${pages} 页`;$('#prev').disabled=state.page<=1;$('#next').disabled=state.page>=pages}
function block(title,content){const section=document.createElement('section');section.className='section';section.append(text('h3',title),content);return section}function chips(items){const wrap=document.createElement('div');wrap.className='chips';for(const item of items||[])wrap.append(text('span',item,'chip'));if(!items?.length)wrap.append(text('span','未填写','chip'));return wrap}
async function showDetail(id){const dialog=$('#detail');$('#detailName').textContent='正在读取…';$('#detailBody').replaceChildren(text('div','正在读取完整诊断…','loading'));dialog.showModal();const response=await fetch('/api/admin/leads/'+id);if(!response.ok){$('#detailBody').textContent='无法读取这条 Lead。';return}const lead=await response.json();$('#detailName').textContent=lead.organization||lead.name;const body=$('#detailBody');body.replaceChildren();const meta=document.createElement('div');meta.className='meta-grid';[['联系人',lead.name],['Email',lead.email],['客户规模',lead.studentCount],['机构类型',lead.businessType],['提交时间',new Date(lead.createdAt).toLocaleString('zh-CN')],['意向等级',lead.leadIntent]].forEach(x=>{const box=document.createElement('div');box.className='meta';box.append(text('span',x[0]),text('strong',x[1]));meta.append(box)});body.append(meta);const scores=document.createElement('div');scores.className='score-grid';[['总分',lead.totalScore],['运营效率',lead.operationalEfficiencyScore],['系统化',lead.systemizationScore],['人员独立',lead.keyPersonScore],['财务控制',lead.financialControlScore],['规模能力',lead.scalabilityScore]].forEach(x=>{const box=document.createElement('div');box.className='metric';box.append(text('span',x[0]),text('strong',x[1]));scores.append(box)});body.append(block('能力评分',scores),block('当前管理工具',chips(lead.currentTools)),block('所有需要改善的问题',chips(lead.improvementAreas)));const priority=text('div',lead.primaryPain,'priority');body.append(block('最急需解决的问题',priority));if(lead.additionalNeeds)body.append(block('其他痛点与需求',text('div',lead.additionalNeeds,'notes')));if(lead.report?.salesBrief)body.append(block('内部 Sales Brief',text('div',lead.report.salesBrief,'notes')))}
let timer;$('#search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{state.page=1;load()},300)});$('#intent').addEventListener('change',()=>{state.page=1;load()});$('#prev').onclick=()=>{state.page--;load()};$('#next').onclick=()=>{state.page++;load()};$('.close').onclick=()=>$('#detail').close();$('#detail').addEventListener('click',event=>{if(event.target===$('#detail'))$('#detail').close()});$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/admin/login'};load().catch(()=>{$('#rows').innerHTML='<tr><td colspan="7" class="empty">暂时无法读取 Lead</td></tr>'});
</script></body></html>
