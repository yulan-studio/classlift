<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sales Admin · ClassLift</title>
  <link rel="icon" type="image/png" href="/images/classlift_logo.png" />
  <link rel="apple-touch-icon" href="/images/classlift_logo.png" />
  <style>
    :root{--ink:#143c35;--deep:#0c2d28;--paper:#f5f2e9;--lime:#d9f04a;--muted:#71807b;--line:#d8ddd7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--deep);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);padding:24px;background-image:radial-gradient(circle at 15% 12%,rgba(217,240,74,.12),transparent 30%)}
    .card{width:min(440px,100%);background:var(--paper);padding:44px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
    .brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}.mark{display:block;width:34px;height:34px;border-radius:7px;object-fit:contain;background:#fff}
    .eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:46px}.card h1{font-family:Georgia,"Microsoft YaHei",serif;font-size:38px;font-weight:500;margin:10px 0}.card>p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:28px}
    label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);background:#fff;outline:0}input:focus{border-color:var(--ink)}button{width:100%;border:0;background:var(--ink);color:#fff;padding:15px;margin-top:22px;font-weight:700;cursor:pointer}button:hover{background:#082d27}button:disabled{opacity:.65}.error{min-height:18px;color:#b44736;font-size:12px;margin-top:13px}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:20px;text-decoration:none}
  </style>
</head>
<body><main class="card"><div class="brand"><img class="mark" src="/images/classlift_logo.png" alt="">ClassLift</div><div class="eyebrow">PRIVATE SALES WORKSPACE</div><h1>销售后台</h1><p>登录后查看诊断 Lead、客户优先事项和业务评分。</p><form id="login"><label for="username">用户名</label><input id="username" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">安全登录 →</button><div id="error" class="error"></div></form><a class="back" href="/">← 返回诊断网站</a></main>
<script>
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(response.status===401)throw new Error('用户名或密码不正确。');if(response.status===429)throw new Error('尝试次数过多，请一分钟后再试。');if(!response.ok){const problem=await response.json().catch(()=>null);throw new Error(problem?.detail||'暂时无法登录。')}location.href='/admin'}catch(exception){error.textContent=exception.message;button.disabled=false}});
</script></body></html>
